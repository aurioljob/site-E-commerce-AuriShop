<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue — AuriShop</title>
  <meta name="description" content="AuriShop, votre boutique en ligne au Cameroun. Découvrez nos produits de qualité, livrés en 48h.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>

<!-- ============================ TOP BAR (promo) ============================ -->
  <div class="topbar">
    <div class="topbar-container">
      <p>
        <i data-lucide="truck" style="width:14px;height:14px;vertical-align:middle;"></i>
        Livraison gratuite dès 100 € — Paiement à la livraison disponible
      </p>
      <div class="topbar-links">
        <a href="#">Aide</a>
        <a href="#">Suivi de commande</a>
      </div>
    </div>
  </div>

  <!-- ============================ NAVBAR ============================ -->
  <header class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-logo">
        <img src="assets/logo.png" alt="AuriShop">
      </a>

      <!-- Barre de recherche -->
      <div class="navbar-search">
        <i data-lucide="search" class="navbar-search-icon"></i>
        <input type="text" id="navbar-search-input" placeholder="Rechercher un produit...">
        <button id="navbar-search-btn">Rechercher</button>
      </div>

      <nav>
        <ul class="navbar-links">
          <li><a href="index.html">Accueil</a></li>
          <li><a href="products.html">Produits</a></li>
          <li><a href="categories.html">Catégories</a></li>
        </ul>
      </nav>

      <div class="navbar-actions">
        <!-- Icônes actions -->
        <a href="wishlist.html" class="navbar-icon" title="Favoris">
          <i data-lucide="heart"></i>
          <span id="wishlist-badge" class="nav-badge" style="display:none;">0</span>
        </a>
        <a href="cart.html" class="navbar-icon" title="Panier">
          <i data-lucide="shopping-cart"></i>
          <span id="cart-badge" class="nav-badge" style="display:none;">0</span>
        </a>

        <!-- Non connecté -->
        <div id="auth-links" style="display:flex; gap:0.5rem;">
          <a href="login.html" class="btn btn-ghost">
            <i data-lucide="user" style="width:16px;height:16px;"></i>
            Connexion
          </a>
          <a href="register.html" class="btn btn-primary">S'inscrire</a>
        </div>

        <!-- Connecté -->
        <div id="user-links" style="display:none; align-items:center; gap:0.75rem;">
          <span id="user-name" style="font-weight:600;font-size:0.9rem;"></span>
          <a href="admin/index.html" id="admin-link" class="btn btn-primary" style="display:none;">
            <i data-lucide="shield" style="width:14px;height:14px;"></i>
            Admin
          </a>
          <a href="profile.html" class="navbar-icon" title="Profil">
            <i data-lucide="user"></i>
          </a>
          <a href="#" id="logout-btn" class="navbar-icon" title="Déconnexion">
            <i data-lucide="log-out"></i>
          </a>
        </div>
      </div>
    </div>
  </header>

  <!-- LAYOUT BOUTIQUE -->
  <div class="shop-layout">

    <!-- SIDEBAR FILTRES -->
    <aside class="filters-sidebar">
      <h3>Filtres</h3>

      <div class="filter-group">
        <h4>Recherche</h4>
        <input type="text" id="search-input" placeholder="Nom du produit...">
      </div>

      <div class="filter-group">
        <h4>Catégories</h4>
        <ul class="filter-category-list" id="categories-list">
          <!-- Rempli par JS -->
        </ul>
      </div>

      <div class="filter-group">
        <h4>Marque</h4>
        <input type="text" id="brand-input" placeholder="Ex : Samsung">
      </div>

      <div class="filter-group">
        <h4>Prix (€)</h4>
        <div class="price-range">
          <input type="number" id="min-price" placeholder="Min" min="0">
          <input type="number" id="max-price" placeholder="Max" min="0">
        </div>
      </div>

      <div class="filter-group">
        <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-size:0.9rem;">
          <input type="checkbox" id="in-stock">
          En stock uniquement
        </label>
      </div>
    </aside>

    <!-- CONTENU PRINCIPAL -->
    <main>
      <div class="shop-header">
        <div>
          <h1>Tous les <span>produits</span></h1>
          <p class="results-count" id="results-count"></p>
        </div>
        <div class="shop-toolbar">
          <label for="sort-select">Trier par :</label>
          <select id="sort-select">
            <option value="created_at">Plus récents</option>
            <option value="price_asc">Prix croissant</option>
            <option value="price_desc">Prix décroissant</option>
            <option value="name">Nom (A-Z)</option>
          </select>
        </div>
      </div>

      <div class="active-filters" id="active-filters"></div>

      <div class="products-grid" id="products-grid">
        <!-- Rempli par JS -->
      </div>

      <div class="pagination" id="pagination"></div>
    </main>
  </div>

  <!-- ✅ UN SEUL script : products.js fait tout -->
  <script type="module" src="js/products.js"></script>
    <script type="module" src="js/index.js"></script>
  <script>window.lucide && window.lucide.createIcons();</script>
</body>
</html>
